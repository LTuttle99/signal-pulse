name: Validate expanded stocks
on:
  push:
    branches: [expand-stock-directory]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - name: Start static preview and test desktop/mobile flows
        run: |
          npm run preview:pages -- --port 4175 > /tmp/pulse-preview.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:4175/signal-pulse/ > /dev/null
          npm run test:pages
